<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Smart Kitchens FZE - Overtime Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.06); opacity: 0; }
      100% { transform: scale(1.06); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 1.75rem;
      border: 3px solid currentColor;
      animation: pulseRing 2s infinite;
      pointer-events: none;
    }

    #loginOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .login-card {
      background: #ffffff;
      padding: 28px 22px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      width: 100%;
      max-width: 370px;
      border-top: 6px solid #0056b3;
      animation: fadeIn 0.4s ease-out;
    }

    .logo-container {
      margin-bottom: 16px;
      padding: 4px;
    }

    .company-logo {
      width: 100%;
      max-width: 230px;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
    }

    .login-title {
      margin: 0 0 6px 0;
      font-size: 19px;
      font-weight: 800;
      color: #1e293b;
    }

    .login-subtitle {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: #64748b;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      text-align: center;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.3s;
      margin-bottom: 14px;
    }

    .input-group input:focus {
      border-color: #0056b3;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0056b3;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 86, 179, 0.25);
      transition: background 0.2s, transform 0.1s;
    }

    .login-btn:active {
      transform: scale(0.98);
      background: #004494;
    }

    .error-text {
      color: #e11d48;
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      min-height: 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col items-center">

  <div id="loginOverlay">
    <div class="login-card">
      <div class="logo-container">
        <img src="logo.png" alt="Smart Kitchens FZE Logo" class="company-logo">
      </div>

      <h2 class="login-title">Smart Kitchens FZE</h2>
      <p class="login-subtitle">Attendance &amp; Overtime Tracker</p>

      <div class="input-group">
        <input
          type="password"
          id="appPassword"
          placeholder="Enter Password"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          onkeydown="handleEnterPassword(event)"
        />
      </div>

      <button type="button" onclick="checkAppPassword()" class="login-btn">Unlock App</button>
      <p id="errorMsg" class="error-text"></p>

      <div id="securityWarningBox" class="hidden mt-3 p-3.5 rounded-2xl bg-red-600 text-white text-left text-xs shadow-lg border-2 border-red-800 space-y-1.5">
        <p class="font-black uppercase tracking-wider text-[11px] flex items-center gap-1.5">
          <span>⚠️</span> UNAUTHORIZED ACCESS WARNING
        </p>
        <p class="leading-relaxed font-medium text-red-50">
          If you are an unrecognized user, your device details, metadata, and IP address are being logged. Unauthorized access may put your data privacy and security at risk!
        </p>
        <p id="deviceMetaText" class="text-[10px] font-mono text-red-100 pt-1.5 border-t border-red-500/60 break-all"></p>
      </div>
    </div>
  </div>

  <div id="editRecordModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4 animate-fade-in">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
