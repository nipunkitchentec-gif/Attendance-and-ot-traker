<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Smart Kitchens FZE - Overtime Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.06); opacity: 0; }
      100% { transform: scale(1.06); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 1.75rem;
      border: 3px solid currentColor;
      animation: pulseRing 2s infinite;
      pointer-events: none;
    }

    #loginOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #eef4ff 0%, #f4f7f6 50%, #e2e8f0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 18px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Background Cartoon People Layer (Top & Bottom Empty Spaces) */
    .bg-people-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bg-people-top {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      height: 120px;
      opacity: 0.92;
    }

    .bg-people-bottom {
      position: absolute;
      bottom: 8px;
      left: 0;
      width: 100%;
      height: 130px;
      opacity: 0.95;
    }

    .login-card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.97);
      padding: 24px 20px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.14);
      text-align: center;
      width: 100%;
      max-width: 370px;
      border-top: 6px solid #0056b3;
      animation: fadeIn 0.4s ease-out;
    }

    .logo-container {
      margin-bottom: 8px;
      padding: 2px;
    }

    .company-logo {
      width: 100%;
      max-width: 220px;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
    }

    .mini-cartoon-stage {
      margin: 2px auto 10px auto;
      max-width: 240px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes cartoonFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes handSpin {
      from { transform: rotate(0deg); transform-origin: 120px 48px; }
      to { transform: rotate(360deg); transform-origin: 120px 48px; }
    }

    @keyframes waveLeft {
      0%, 100% { transform: rotate(0deg); transform-origin: 92px 50px; }
      50% { transform: rotate(-16deg); transform-origin: 92px 50px; }
    }

    @keyframes twinkleSoft {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes blinkSoft {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    /* Walking & Bobbing Cartoon People Animations */
    @keyframes walkRight {
      0% { transform: translateX(-110px); }
      100% { transform: translateX(calc(100vw + 110px)); }
    }

    @keyframes walkLeft {
      0% { transform: translateX(calc(100vw + 110px)); }
      100% { transform: translateX(-110px); }
    }

    @keyframes stepBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes legSwingA {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes legSwingB {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes armSwingA {
      0%, 100% { transform: rotate(16deg); }
      50% { transform: rotate(-16deg); }
    }

    @keyframes armSwingB {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(16deg); }
    }

    .walk-track-right {
      animation: walkRight 16s linear infinite;
    }

    .walk-track-right-slow {
      animation: walkRight 21s linear -7s infinite;
    }

    .walk-track-left {
      animation: walkLeft 18s linear -4s infinite;
    }

    .person-bob {
      animation: stepBob 0.55s ease-in-out infinite;
    }

    .leg-a {
      transform-box: fill-box;
      transform-origin: top center;
      animation: legSwingA 0.55s ease-in-out infinite;
    }

    .leg-b {
      transform-box: fill-box;
      transform-origin: top center;
      animation: legSwingB 0.55s ease-in-out infinite;
    }

    .arm-a {
      transform-box: fill-box;
      transform-origin: top center;
      animation: armSwingA 0.55s ease-in-out infinite;
    }

    .arm-b {
      transform-box: fill-box;
      transform-origin: top center;
      animation: armSwingB 0.55s ease-in-out infinite;
    }

    .cartoon-float {
      animation: cartoonFloat 3s ease-in-out infinite;
    }

    .clock-hand-spin {
      animation: handSpin 6s linear infinite;
    }

    .cartoon-wave-left {
      animation: waveLeft 1.6s ease-in-out infinite;
    }

    .cartoon-twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkleSoft 2.2s ease-in-out infinite;
    }

    .cartoon-twinkle-delay {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkleSoft 2.2s ease-in-out 1.1s infinite;
    }

    .cartoon-blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blinkSoft 4.2s infinite;
    }

    .login-title {
      margin: 0 0 4px 0;
      font-size: 19px;
      font-weight: 800;
      color: #1e293b;
    }

    .login-subtitle {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #64748b;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      text-align: center;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.3s;
      margin-bottom: 14px;
    }

    .input-group input:focus {
      border-color: #0056b3;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0056b3;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 86, 179, 0.25);
      transition: background 0.2s, transform 0.1s;
    }

    .login-btn:active {
      transform: scale(0.98);
      background: #004494;
    }

    .error-text {
      color: #e11d48;
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      min-height: 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col items-center">

  <div id="loginOverlay">
    <!-- Top & Bottom Cartoon People Background -->
    <div class="bg-people-layer" aria-hidden="true">
      <!-- Top Empty Area: Walking Technician with Cap -->
      <div class="bg-people-top">
        <svg viewBox="0 0 120 110" width="90" height="82" class="walk-track-right">
          <ellipse cx="60" cy="100" rx="22" ry="4.5" fill="#cbd5e1" />
          <g class="person-bob">
            <!-- Back Arm -->
            <line x1="60" y1="50" x2="52" y2="68" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" class="arm-b" />
            <!-- Back Leg -->
            <line x1="58" y1="72" x2="51" y2="96" stroke="#334155" stroke-width="5.5" stroke-linecap="round" class="leg-b" />
            <!-- Front Leg -->
            <line x1="62" y1="72" x2="69" y2="96" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" class="leg-a" />
            <!-- Torso (Blue Work Shirt) -->
            <rect x="52" y="45" width="16" height="28" rx="7" fill="#2563eb" />
            <!-- Head -->
            <circle cx="60" cy="33" r="10.5" fill="#fcd34d" />
            <!-- Eye & Smile -->
            <circle cx="64" cy="32" r="1.5" fill="#0f172a" />
            <path d="M62 37 Q65 39 67 37" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
            <!-- Cap -->
            <path d="M49 30 Q60 19 71 30 Z" fill="#0284c7" />
            <rect x="61" y="28" width="14" height="3.5" rx="1.75" fill="#0369a1" />
            <!-- Front Arm -->
            <line x1="60" y1="50" x2="70" y2="67" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" class="arm-a" />
          </g>
        </svg>
      </div>

      <!-- Bottom Empty Area: Two Cartoon Workers Walking -->
      <div class="bg-people-bottom">
        <!-- Person 1 (Walking Right) -->
        <svg viewBox="0 0 120 115" width="96" height="92" class="walk-track-right-slow" style="position:absolute; bottom:0;">
          <ellipse cx="60" cy="105" rx="24" ry="5" fill="#cbd5e1" />
          <g class="person-bob">
            <line x1="60" y1="52" x2="50" y2="70" stroke="#047857" stroke-width="5" stroke-linecap="round" class="arm-b" />
            <line x1="58" y1="75" x2="50" y2="101" stroke="#334155" stroke-width="5.5" stroke-linecap="round" class="leg-b" />
            <line x1="62" y1="75" x2="70" y2="101" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" class="leg-a" />
            <rect x="52" y="47" width="16" height="29" rx="7" fill="#10b981" />
            <circle cx="60" cy="34" r="10.5" fill="#fde68a" />
            <circle cx="64" cy="33" r="1.5" fill="#0f172a" />
            <path d="M62 38 Q65 40 67 38" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
            <path d="M50 31 Q60 21 70 31 Z" fill="#059669" />
            <line x1="60" y1="52" x2="71" y2="69" stroke="#34d399" stroke-width="5" stroke-linecap="round" class="arm-a" />
          </g>
        </svg>

        <!-- Person 2 (Walking Left) -->
        <svg viewBox="0 0 120 115" width="96" height="92" class="walk-track-left" style="position:absolute; bottom:4px;">
          <ellipse cx="60" cy="105" rx="24" ry="5" fill="#cbd5e1" />
          <g class="person-bob">
            <line x1="60" y1="52" x2="70" y2="70" stroke="#b45309" stroke-width="5" stroke-linecap="round" class="arm-b" />
            <line x1="62" y1="75" x2="70" y2="101" stroke="#334155" stroke-width="5.5" stroke-linecap="round" class="leg-b" />
            <line x1="58" y1="75" x2="50" y2="101" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" class="leg-a" />
            <rect x="52" y="47" width="16" height="29" rx="7" fill="#f59e0b" />
            <circle cx="60" cy="34" r="10.5" fill="#fcd34d" />
            <circle cx="56" cy="33" r="1.5" fill="#0f172a" />
            <path d="M53 38 Q55 40 58 38" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
            <path d="M50 31 Q60 21 70 31 Z" fill="#d97706" />
            <line x1="60" y1="52" x2="49" y2="69" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" class="arm-a" />
          </g>
        </svg>
      </div>
    </div>

    <div class="login-card">
      <div class="logo-container">
        <img src="logo.png" alt="Smart Kitchens FZE Logo" class="company-logo">
      </div>

      <div class="mini-cartoon-stage" aria-hidden="true">
        <svg viewBox="0 0 240 105" class="w-full h-[96px] mx-auto overflow-visible">
          <ellipse cx="120" cy="96" rx="76" ry="6" fill="#e2e8f0" />
          <g class="cartoon-float">
            <circle cx="120" cy="48" r="28" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3" />
            <circle cx="120" cy="48" r="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
            <path d="M104 20 Q120 10 136 20" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" />
            <circle cx="113" cy="45" r="2.3" fill="#0f172a" class="cartoon-blink" />
            <circle cx="127" cy="45" r="2.3" fill="#0f172a" class="cartoon-blink" />
            <path d="M115 52 Q120 56 125 52" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
            <line x1="120" y1="48" x2="120" y2="34" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
            <g class="clock-hand-spin">
              <line x1="120" y1="48" x2="132" y2="48" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" />
            </g>
            <path d="M92 50 Q80 42 84 32" fill="none" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round" class="cartoon-wave-left" />
            <path d="M148 50 Q160 44 164 54" fill="none" stroke="#1d4ed8" stroke-width="2.8" stroke-linecap="round" />
          </g>
          <circle cx="52" cy="30" r="3" fill="#10b981" class="cartoon-twinkle" />
          <circle cx="188" cy="26" r="3.5" fill="#f59e0b" class="cartoon-twinkle-delay" />
          <circle cx="194" cy="68" r="2.5" fill="#3b82f6" class="cartoon-twinkle" />
        </svg>
      </div>

      <h2 class="login-title">Smart Kitchens FZE</h2>
      <p class="login-subtitle">Attendance &amp; Overtime Tracker</p>

      <div class="input-group">
        <input
          type="password"
          id="appPassword"
          placeholder="Enter Password"
          onkeydown="handleEnterPassword(event)"
        />
      </div>

      <button type="button" onclick="checkAppPassword()" class="login-btn">Unlock App</button>
      <p id="errorMsg" class="error-text"></p>

      <div id="securityWarningBox" class="hidden mt-3 p-3.5 rounded-2xl bg-red-600 text-white text-left text-xs shadow-lg border-2 border-red-800 space-y-1.5">
        <p class="font-black uppercase tracking-wider text-[11px] flex items-center gap-1.5">
          <span>⚠️</span> UNAUTHORIZED ACCESS WARNING
        </p>
        <p class="leading-relaxed font-medium text-red-50">
          If you are an unrecognized user, your device details, metadata, and IP address are being logged. Unauthorized access may put your data privacy and security at risk!
        </p>
        <p id="deviceMetaText" class="text-[10px] font-mono text-red-100 pt-1.5 border-t border-red-500/60 break-all"></p>
      </div>
    </div>
  </div>

  <div id="editRecordModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4 animate-fade-in">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h3 class="text-lg font-extrabold text-slate-900">Edit Attendance</h3>
          <p class="text-xs text-slate-500">Update IN / OUT time (UAE Time)</p>
        </div>
        <button id="closeEditModalBtn" type="button" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold">✕</button>
      </div>

      <form id="editRecordForm" class="space-y-3">
        <input type="hidden" id="editRecordId" />
        <div>
          <label for="editDateInput" class="block text-xs font-bold text-slate-700 mb-1">Date (YYYY-MM-DD)</label>
          <input id="editDateInput" type="date" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold text-slate-900 focus:outline-none focus:border-blue-600" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="editInInput" class="block text-xs font-bold text-slate-700 mb-1">IN Time</label>
            <input id="editInInput" type="time" required class="w-full px-
